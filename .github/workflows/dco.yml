name: DCO
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check_dco:
    name: Check DCO
    runs-on: ubuntu-latest
    steps:
      - name: Run dco-check
        uses: christophebedard/dco-check@0.5.1
        with:
          args: '--exclude-emails=49699333+dependabot[bot]@users.noreply.github.com'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
