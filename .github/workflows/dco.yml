name: DCO
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check_dco:
    name: Check DCO
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Run dco-check
        uses: christophebedard/dco-check@0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}